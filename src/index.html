<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Charm:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="engagement-photo.jpg">
</head>
<script>
    const SITE_CONTENT = "<!-- ENCRYPTED_CONTENT -->"
    const IV = new TextEncoder().encode("wedding-website-random-iv");

    function showIncorrectPassword() {
        document.querySelector("#site-password input").style.outline = "#9c3d2a 2px solid";
        document.querySelector("#site-password input").style.outlineOffset = "-2px";
        document.querySelector("#site-password input").style.backgroundColor = "#9c3d2a11";
        document.querySelector("#incorrect-password").style.display = "block";
    }

    async function attemptDecryption(password) {
        try {
            // Attempt decryption
            const decryptedContent = await window.crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: IV, // Initialization vector
                    additionalData: new TextEncoder().encode("Additional data used to verify decryption")
                },
                await crypto.subtle.importKey(
                    "raw",
                    await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password)),
                    "AES-GCM",
                    false,
                    ["decrypt"]
                ),
                Uint8Array.from(atob(SITE_CONTENT), (c) => c.charCodeAt(0))
            )
            const decryptedText = new TextDecoder().decode(decryptedContent);
            await document.fonts.ready;
            document.open()
            document.write(decryptedText);
            document.close();
        } catch (error) {
            console.error("Decryption failed:", error);
            localStorage.removeItem("site_password");
            showIncorrectPassword();
        }
    }

    // Check to see if we've saved a password
    if (localStorage.getItem("site_password")) {
        attemptDecryption(localStorage.getItem("site_password"));
    }

    function onPasswordSubmit() {
        const passwordInput = document.querySelector("#site-password input");
        const password = passwordInput.value.trim().toLowerCase();
        if (password) {
            localStorage.setItem("site_password", password);
            attemptDecryption(password);
        }
        passwordInput.value = "";
        passwordInput.focus();
    }
</script>

<style>
    body {
        background-color: #4d5e54;
        color: #ffffff;

        font-family: "Inter", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
    }

    h1 {
        font-family: "Charm", serif;
        font-weight: 300;
        font-size: 3rem;
        margin: 0;
        line-height: 0.8;
    }

    p {
        font-size: small;
        margin: 0;
    }

    section#main {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 25vh;
    }

    #site-password {
        background-color: #ffffff;
        color: #4d5e54;
        padding: 4rem;
        display: flex;
        flex-direction: column;
        border-radius: 1rem;
        filter: drop-shadow(10px 10px 10px rgba(0, 0, 0, 0.25));
        gap: 1rem;
    }

    #site-password input {
        border-radius: 1rem;
        border: none;
        box-sizing: border-box;
        outline-offset: -1px;
        outline: #999999 1px solid;
        padding: 1rem;
        min-width: 18rem;
    }

    #site-password input:focus {
        outline-offset: -2px;
        outline: #709073 2px solid;
    }

    #site-password button {
        background-color: #4d5e54;
        color: #ffffff;
        border: none;
        padding: 1rem;
        border-radius: 1rem;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #site-password a {
        color: unset;
        text-decoration: underline;
    }
</style>

<body>
    <section id="main">
        <div id="site-password">
            <h1>Welcome.</h1>
            <p>Please enter the password to from your invitation</p>
            <br>
            <p style="font-weight: bold; font-size: smaller; margin-bottom: -0.5rem">Password</p>
            <input type="password" onkeydown="if(event.key === 'Enter'){onPasswordSubmit()}"
                placeholder="This page is password protected">
            <p id="incorrect-password" style="color: #9c3d2a; display: none; margin: 0; margin-top: -0.5rem; font-size: smaller;">Incorrect password. Please try again.</p>
            <button onclick="onPasswordSubmit()">Continue </button>
            <p>Contact Nathan at <a href="mailto:expitau@gmail.com">expitau@gmail.com</a> if you are having problems</p>
        </div>
    </section>
</body>

</html>
